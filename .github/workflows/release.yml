# Release workflow — publishes when a v* tag is pushed (or via manual dispatch
# from main as a fallback). Intentionally gated four ways:
#   1. Only v* tag pushes and manual dispatches from main are accepted; pushing
#      commits to main never publishes.
#   2. On tag runs, the tag name must match package.json exactly (v<version>),
#      so a mis-tagged commit cannot publish the wrong version.
#   3. A release-readiness guard refuses the 0.0.0 placeholder version and trees
#      with unconsumed changesets (i.e. `pnpm changeset version` was never run).
#   4. The publish job targets the `npm-publish` GitHub Environment, which must be
#      created with required reviewers before the first run. The NPM_TOKEN secret
#      lives in that environment, not at repo level.
# Recommended: add a tag ruleset so only maintainers can create v* tags.
# Full release process: docs/RELEASING.md
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create GitHub Releases
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Guard — only v* tags or dispatch from main
        if: "!startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main'"
        run: |
          echo "::error::Releases run from v* tags or a manual dispatch on main (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Start memcached test services (plain + TLS)
        run: docker compose up -d

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard — version must be release-ready
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "0.0.0" ]; then
            echo "::error::package.json is still at the 0.0.0 placeholder — run 'pnpm changeset version' first."
            exit 1
          fi
          pending="$(find .changeset -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')"
          if [ "$pending" != "0" ]; then
            echo "::error::$pending unconsumed changeset(s) present — run 'pnpm changeset version' and commit before releasing."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi
          echo "Releasing version $version from ${GITHUB_REF_NAME}"

      - name: Quality gates
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm build && pnpm check:exports

      # npm refuses --provenance when the source repo is private, so it is
      # applied only once the repo is public. Until then packages publish
      # without a provenance statement; nothing else changes.
      - name: Publish to npm (provenance when the repo is public)
        run: |
          provenance=""
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            provenance="--provenance"
          fi
          pnpm publish --access public $provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release from CHANGELOG
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists - skipping (re-run)."
            exit 0
          fi
          awk -v ver="## ${version}" '$0 == ver { flag = 1; next } /^## / { flag = 0 } flag' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for ${version} - creating release with autogenerated notes."
            gh release create "${GITHUB_REF_NAME}" --title "v${version}" --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" --title "v${version}" --notes-file /tmp/release-notes.md
          fi
