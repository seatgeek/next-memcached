<svg xmlns="http://www.w3.org/2000/svg" width="850" height="340" viewBox="0 0 850 340" font-family="Inter, -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrD2" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#e4e4e7"/>
    </marker>
    <marker id="arrD2m" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#71717a"/>
    </marker>

    <symbol id="i-chip2" viewBox="0 0 20 20">
      <rect x="5" y="5" width="10" height="10" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <line x1="8" y1="1.6" x2="8" y2="5"/>
        <line x1="12" y1="1.6" x2="12" y2="5"/>
        <line x1="8" y1="15" x2="8" y2="18.4"/>
        <line x1="12" y1="15" x2="12" y2="18.4"/>
        <line x1="1.6" y1="8" x2="5" y2="8"/>
        <line x1="1.6" y1="12" x2="5" y2="12"/>
        <line x1="15" y1="8" x2="18.4" y2="8"/>
        <line x1="15" y1="12" x2="18.4" y2="12"/>
      </g>
    </symbol>
    <symbol id="i-cube2" viewBox="0 0 20 20">
      <path d="M10 2.2 17 5.9 17 14.1 10 17.8 3 14.1 3 5.9Z M10 2.2 10 10 M10 10 17 5.9 M10 10 3 5.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="850" height="340" fill="#0a0a0a"/>

  <g transform="translate(24,24)">
    <!-- Next.js instance (small, left) -->
    <rect x="20" y="20" width="120" height="56" rx="10" fill="#18181b" stroke="#27272a"/>
    <use href="#i-cube2" x="45" y="40" width="16" height="16" color="#a1a1aa"/>
    <text x="67" y="53" font-size="13" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" letter-spacing="-0.3" fill="#fafafa">Next.js</text>

    <!-- memcached (small, right) -->
    <rect x="632" y="15" width="150" height="66" rx="10" fill="#fafafa"/>
    <rect x="662" y="5" width="90" height="20" rx="10" fill="#18181b" stroke="#27272a"/>
    <text x="707" y="19" text-anchor="middle" fill="#a1a1aa" font-size="9.5" font-weight="600" letter-spacing="0.2">Shared cache</text>
    <use href="#i-chip2" x="652" y="38" width="20" height="20" color="#52525b"/>
    <text x="680" y="53" fill="#18181b" font-size="14.5" font-weight="700" letter-spacing="-0.2">memcached</text>

    <!-- request / response -->
    <text x="386" y="32" text-anchor="middle" fill="#a1a1aa" font-size="10.5" font-weight="600">① get(key)</text>
    <line x1="140" y1="40" x2="632" y2="40" stroke="#e4e4e7" stroke-width="1.4" marker-end="url(#arrD2)"/>
    <line x1="632" y1="58" x2="140" y2="58" stroke="#71717a" stroke-width="1.4" marker-end="url(#arrD2m)"/>
    <text x="386" y="72" text-anchor="middle" fill="#a1a1aa" font-size="10.5" font-weight="600">② hit: envelope { tags, body, stale }</text>

    <!-- revalidate: instance -> table -->
    <path d="M80,76 L80,142 Q80,150 88,150 L242,150 Q250,150 250,158 L250,170" fill="none" stroke="#e4e4e7" stroke-width="1.4" marker-end="url(#arrD2)"/>
    <text x="160" y="145" text-anchor="middle" fill="#a1a1aa" font-size="10.5" font-weight="600">③ revalidateTag(tag)</text>

    <!-- tag records table (centered between the two services) -->
    <text x="401" y="157" text-anchor="middle" fill="#a1a1aa" font-size="10.5" font-weight="600" letter-spacing="0.2">TAG RECORDS — stored in memcached as t:&lt;sha1&gt; keys</text>
    <rect x="211" y="170" width="380" height="112" rx="10" fill="#18181b" stroke="#27272a"/>
    <rect x="211" y="170" width="380" height="28" rx="10" fill="#1f1f23"/>
    <rect x="211" y="184" width="380" height="14" fill="#1f1f23"/>
    <line x1="211" y1="198" x2="591" y2="198" stroke="#27272a"/>
    <line x1="211" y1="226" x2="591" y2="226" stroke="#27272a"/>
    <line x1="211" y1="254" x2="591" y2="254" stroke="#27272a"/>
    <line x1="411" y1="170" x2="411" y2="282" stroke="#27272a"/>
    <line x1="521" y1="170" x2="521" y2="282" stroke="#27272a"/>
    <text x="225" y="188" fill="#a1a1aa" font-size="10.5" font-weight="700">tag</text>
    <text x="425" y="188" fill="#a1a1aa" font-size="10.5" font-weight="700">expired</text>
    <text x="535" y="188" fill="#a1a1aa" font-size="10.5" font-weight="700">stale</text>
    <g font-size="11" fill="#fafafa">
      <text x="225" y="216">t:3f9a21e0</text>
      <text x="425" y="216" fill="#71717a">—</text>
      <text x="535" y="216" fill="#71717a">—</text>
      <text x="225" y="244">t:8b4c77aa</text>
      <text x="425" y="244" fill="#a1a1aa">1723582001</text>
      <text x="535" y="244" fill="#a1a1aa">1723581701</text>
      <text x="225" y="272">t:c02de145</text>
      <text x="425" y="272" fill="#71717a">—</text>
      <text x="535" y="272" fill="#71717a">—</text>
    </g>

    <!-- link table -> memcached -->
    <path d="M550,170 Q550,150 558,150 L699,150 Q707,150 707,142 L707,81" fill="none" stroke="#71717a" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="620" y="145" text-anchor="middle" fill="#71717a" font-size="9.5" font-style="italic">same memcached keyspace</text>
  </g>
</svg>
